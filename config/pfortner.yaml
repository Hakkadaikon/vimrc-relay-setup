server:
  port: 3000
  upstream_relay: 'ws://127.0.0.1:8080'
  idle_timeout: 600
  x_forwarded_for: true

  shutdown:
    drain_timeout: 30
    force_after: 30

  connections:
    max: 200
    # Cap a single IP at 20 concurrent connections so one bad client
    # cannot exhaust the global pool. Tune up if legitimate sharing
    # via CGNAT/cloudflared causes 429s.
    max_per_ip: 20

admin:
  enabled: true
  auth_token: '${ADMIN_TOKEN}'
  path: '/admin'

auth:
  enabled: false

pipelines:
  client:
    - policy: kind-filter
      config:
        mode: allow
        kinds: [0, 5, 7, 40, 41, 42, 10002, 27235]
    - policy: spam-filter
      config:
        max_content_length: 1000
        reject_duplicate:
          enabled: true
          window: 300
    - policy: accept

  server:
    - policy: accept
